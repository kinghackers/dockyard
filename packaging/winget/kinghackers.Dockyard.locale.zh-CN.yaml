ShortDescription: 跨主机的多主机 Docker 桌面管理客户端。
Description: Dockyard 是一款免费开源的桌面应用，用于统一管理分布在多台主机上的 Docker。它通过 SSH 或 TCP 连接本地与远程 Docker 守护进程，把各主机的容器、镜像、卷和网络汇聚到同一界面，并内置终端与实时日志查看器。
